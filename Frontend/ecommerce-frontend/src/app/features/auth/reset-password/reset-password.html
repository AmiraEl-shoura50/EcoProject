<div class="min-h-screen bg-brand-cream flex items-center justify-center px-4">
  <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md animate-fade-in">

    @if (successMessage) {
      <div class="text-center">
        <h1 class="font-serif text-2xl text-brand-black mb-4">تم بنجاح ✅</h1>
        <p class="text-brand-brown text-sm">{{ successMessage }}</p>
        <p class="text-gray-400 text-xs mt-4">هيتم تحويلك لتسجيل الدخول تلقائيًا...</p>
      </div>
    } @else {
      <div class="text-center mb-8">
        <h1 class="font-serif text-3xl text-brand-black mb-2">كلمة مرور جديدة</h1>
        <p class="text-brand-brown text-sm">اكتب كلمة المرور الجديدة بتاعتك</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label class="block text-sm text-brand-black mb-1.5 font-medium">كلمة المرور الجديدة</label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="newPassword"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 pl-11 text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold/50 focus:border-brand-gold transition-all"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-brand-gold transition-colors"
            >
              <lucide-angular [img]="showPassword ? EyeOffIcon : EyeIcon" [size]="18"></lucide-angular>
            </button>
          </div>
          @if (form.get('newPassword')?.invalid && form.get('newPassword')?.touched) {
            <p class="text-red-500 text-xs mt-1.5">كلمة المرور لازم تكون 6 أحرف على الأقل</p>
          }
        </div>


        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full bg-brand-black text-white py-3.5 rounded-lg font-medium hover:bg-brand-gold transition-all duration-300 disabled:opacity-50"
        >
          {{ isLoading ? 'جاري الحفظ...' : 'حفظ كلمة المرور' }}
        </button>
      </form>
    }

  </div>
</div>
