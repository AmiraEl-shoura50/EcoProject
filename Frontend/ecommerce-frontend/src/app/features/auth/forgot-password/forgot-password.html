<div class="min-h-screen bg-brand-cream flex items-center justify-center px-4">
  <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md animate-fade-in">

    @if (!submitted) {
      <div class="text-center mb-8">
        <h1 class="font-serif text-3xl text-brand-black mb-2">نسيت كلمة المرور؟</h1>
        <p class="text-brand-brown text-sm">اكتب إيميلك وهنبعتلك رابط إعادة التعيين</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label class="block text-sm text-brand-black mb-1.5 font-medium">البريد الإلكتروني</label>
          <input
            type="email"
            formControlName="email"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold/50 focus:border-brand-gold transition-all"
          />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <p class="text-red-500 text-xs mt-1.5">من فضلك ادخل بريد إلكتروني صحيح</p>
          }
        </div>

        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full bg-brand-black text-white py-3.5 rounded-lg font-medium hover:bg-brand-gold transition-all duration-300 disabled:opacity-50"
        >
          {{ isLoading ? 'جاري الإرسال...' : 'إرسال الرابط' }}
        </button>
      </form>
    } @else {
      <div class="text-center">
        <h1 class="font-serif text-2xl text-brand-black mb-4">تحقق من بريدك 📧</h1>
        <p class="text-brand-brown text-sm">{{ responseMessage }}</p>
      </div>
    }

    <p class="text-center text-sm text-brand-brown mt-6">
      <a routerLink="/login" class="text-brand-gold font-semibold hover:underline">
        الرجوع لتسجيل الدخول
      </a>
    </p>

  </div>
</div>
