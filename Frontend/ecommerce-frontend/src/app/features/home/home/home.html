<div class="bg-brand-cream min-h-screen">

  <!-- Hero Section -->
  <section class="bg-brand-black text-white py-20 px-4">
    <div class="max-w-4xl mx-auto text-center">

      <h1 class="font-serif text-5xl mb-4">
        اكتشف <span class="text-brand-gold">Smart Shop</span>
      </h1>

      <p class="text-gray-300 text-lg">
        تسوق أفضل المنتجات من بائعين موثوقين في مكان واحد
      </p>

    </div>
  </section>


  <!-- Products Section -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">

    <h2 class="font-serif text-3xl text-brand-black mb-8">
      منتجات مميزة
    </h2>


    @if (isLoading()) {

      <!-- Skeleton Loading -->
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

        @for (i of skeletonItems; track i) {

          <div class="bg-white rounded-xl overflow-hidden shadow-sm animate-pulse">

            <div class="bg-gray-200 h-48 w-full"></div>

            <div class="p-4 space-y-2">
              <div class="bg-gray-200 h-4 w-3/4 rounded"></div>
              <div class="bg-gray-200 h-4 w-1/2 rounded"></div>
            </div>

          </div>

        }

      </div>


    } @else if (products().length === 0) {

      <p class="text-center text-brand-brown py-20">
        لا يوجد منتجات متاحة حاليًا
      </p>


    } @else {

      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

        @for (product of products(); track product.id) {

       <app-product-card [product]="product"></app-product-card>

        }

      </div>

    }

  </section>

</div>
