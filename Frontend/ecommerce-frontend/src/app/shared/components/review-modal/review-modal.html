<div
  class="fixed inset-0 z-[60] bg-black/60 flex items-end sm:items-center justify-center sm:p-4"
  (click)="closed.emit()"
>

  <div
    class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-6"
    (click)="$event.stopPropagation()"
  >

    <div class="flex items-start justify-between gap-3 mb-5">
      <div class="min-w-0">
        <h3 class="font-serif text-xl text-brand-black">قيّم المنتج</h3>
        <p class="text-sm text-brand-brown mt-1 line-clamp-1">{{ productName() }}</p>
      </div>
      <button
        type="button"
        (click)="closed.emit()"
        class="w-9 h-9 shrink-0 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 transition-colors"
        aria-label="إغلاق"
      >
        <lucide-angular [img]="CloseIcon" [size]="20"></lucide-angular>
      </button>
    </div>

    <!-- النجوم -->
    <div class="text-center mb-5">
      <div class="flex justify-center gap-1">
        @for (n of positions; track n) {
          <button
            type="button"
            (click)="rating.set(n)"
            (mouseenter)="hovered.set(n)"
            (mouseleave)="hovered.set(0)"
            class="p-1 transition-transform hover:scale-110"
            [class.text-brand-gold]="n <= activeRating()"
            [class.text-gray-300]="n > activeRating()"
            [attr.aria-label]="n + ' من 5'"
          >
            <lucide-angular [img]="StarIcon" [size]="36" [class.icon-filled]="n <= activeRating()"></lucide-angular>
          </button>
        }
      </div>
      <p class="text-sm text-brand-gold h-5 mt-1">{{ label() }}</p>
    </div>

    <!-- التعليق -->
    <div class="mb-5">
      <label class="block text-sm text-brand-black mb-1.5 font-medium">
        تعليقك <span class="text-xs font-normal text-gray-400">(اختياري)</span>
      </label>
      <textarea
        [(ngModel)]="comment"
        [attr.maxlength]="maxLength"
        rows="4"
        placeholder="شاركنا تجربتك مع المنتج"
        class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold/50 focus:border-brand-gold transition-all resize-none"
      ></textarea>
      <p class="text-xs text-gray-400 mt-1 text-end">{{ comment.length }} / {{ maxLength }}</p>
    </div>

    <div class="flex gap-3">
      <button
        type="button"
        (click)="submit()"
        [disabled]="isSubmitting() || rating() === 0"
        class="flex-1 bg-brand-black text-white text-sm py-3 rounded-lg hover:bg-brand-gold transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
      >
        {{ isSubmitting() ? 'جاري الإرسال...' : 'إرسال التقييم' }}
      </button>
      <button
        type="button"
        (click)="closed.emit()"
        class="px-6 text-sm text-brand-brown border border-gray-200 rounded-lg hover:bg-brand-cream transition-colors"
      >
        إلغاء
      </button>
    </div>

  </div>

</div>
