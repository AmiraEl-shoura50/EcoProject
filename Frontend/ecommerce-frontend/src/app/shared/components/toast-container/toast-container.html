<div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-full max-w-sm px-4">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="rounded-lg px-4 py-3 shadow-lg text-sm font-medium text-white animate-slide-down flex items-center justify-between gap-3"
      [class.bg-red-500]="toast.type === 'error'"
      [class.bg-green-600]="toast.type === 'success'"
    >
      <span>{{ toast.message }}</span>
      <button (click)="toastService.remove(toast.id)" class="text-white/80 hover:text-white">✕</button>
    </div>
  }
</div>
